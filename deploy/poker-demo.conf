# Nginx 反向代理配置（支持 WebSocket / Socket.io）
# 用法：
#   1) 把本文件放到 /etc/nginx/sites-available/poker-demo
#   2) sudo ln -s /etc/nginx/sites-available/poker-demo /etc/nginx/sites-enabled/
#   3) 把 server_name 改成你的域名（如 poker.yourdomain.com）
#   4) 若还没域名，先按 http 跑，再 sudo certbot --nginx -d 你的域名 自动上 HTTPS
#   5) sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name poker.example.com;   # ← 改成你的域名；只用 IP 访问可删掉这行

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # WebSocket 升级（Socket.io 必须）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
